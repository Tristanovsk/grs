# pyproject.toml
[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grs"
version = "2.2.0"
description = "GRS processor for atmospheric correction of high-spatial resolution and multispectral satellite images"
readme = "pypi_README.rst"
authors = [{ name = "Tristan Harmel", email = "tristan.harmel@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["Sentinel-2","Landsat-8","Landsat-9","atmospheric correction", "EO satellite"]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"grs"= ['*.yml']
"*"= ['data/lut/gases/*.nc', 'data/auxiliary/*.txt']

[tool.setuptools.exclude-package-data]
"*" = [".gitattributes"]

[project.scripts]
grs = "grs.run:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest"]
docs = [
    "sphinx>=7",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "myst-nb>=1.0",
    "linkify-it-py",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/CNES/GRSprocessor"
Documentation = "https://cnes.github.io/GRSprocessor"
