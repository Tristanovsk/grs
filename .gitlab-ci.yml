workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

include:
  # Analyse de sécurité statique du code
  - template: Jobs/SAST.latest.gitlab-ci.yml

  # Composants de l'Usine Logicielle
  - component: $CI_SERVER_FQDN/usinelogicielle/public/gitlab-ci-components/sonarqube-component/sonarqube@$COMPONENT_UL_SONARQUBE_VERSION
    inputs:
      stage: sonarqube
      sq_users_admin: $SONAR_MEMBERS
      sonar_project_key: $SONAR_PROJECT_KEY
      sonar_project_name: $SONAR_PROJECT_NAME
      tag_image_scripts: $COMPONENT_UL_SONARQUBE_VERSION

  - component: ${CI_SERVER_FQDN}/usinelogicielle/public/gitlab-ci-components/antivirus-clamav/analyse-clamav@$COMPONENT_UL_ANTIVIRUS_VERSION
    inputs:
      list_to_scan:
        - ${CI_PROJECT_DIR}

stages:
  - init
  # quality
  - test
  - package
  - sonarqube
  - security

# Configuration par défaut
default:
  tags:
    - Usine_Logicielle
  image: ${PUBLIC_REMOTE_REGISTRY_DOCKER}/${IMAGE_PYTHON}
  timeout: 30 minutes
  before_script:
    - export REQUESTS_CA_BUNDLE=${CNES_CERTIFICATE}
    - export SSL_CERT_FILE=${CNES_CERTIFICATE}

# Remplacement de l'ancre YAML par une fonction réutilisable via !reference
.jfrog_helpers:
  restore_config:
    - chmod 755 jfrog
    - export UUID=$(cat uuid.txt)

variables:
  DEBUG: "false"
  PUBLIC_REMOTE_REGISTRY_DOCKER: "${ARTIFACTORY_HOST}/publicremotes-docker"
  IMAGE_PYTHON: "python:3.11.14-bookworm"
  IMAGE_PODMAN: "ubi9/podman:9.5"
  IMAGE_SONAR: "sonarsource/sonar-scanner-cli:4.5"

  # JFrog CLI
  JFROG_CLI_VERSION: "${ULVAR_JFROG_CLI_VERSION}"
  CI: "true"
  JFROG_CLI_HOME_DIR: ".jfrog"
  JFROG_CLI_TEMP_DIR: ".jfrog_tmp"
  JFROG_OS: "jfrog-cli-linux-amd64"
  JFROG_CLI_BUILD_NAME: "${CI_PROJECT_PATH}_${CI_COMMIT_REF_SLUG}_gitlab-ci"
  JFROG_CLI_BUILD_NUMBER: "${CI_PIPELINE_ID}"

  # Registres & Dépôts
  CI_REGISTRY: "https://${UL_ARTIFACTORY_HOST}"
  CI_REGISTRY_USER: "${ARTIFACTORY_USER}"
  CI_REGISTRY_PASSWORD: "${ARTIFACTORY_TOKEN}"
  CI_TEMPLATE_REGISTRY_HOST: "${UL_ARTIFACTORY_HOST}/publicremotes-docker"

  # Python / Pip
  PIP_INDEX_URL: "https://${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}@${UL_ARTIFACTORY_HOST}/artifactory/api/pypi/pypi/simple"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.pip-cache/"
  CONDA_ENVS_DIRS: ".conda/envs"

  # Docker Image Details
  TARGET_REPO: "obs2co-docker"
  SUFFIX_DOCKER_IMAGE: "grs"
  DOCKER_IMAGE_NAME: "${UL_ARTIFACTORY_HOST}/${TARGET_REPO}/${SUFFIX_DOCKER_IMAGE}"

  GIT_LFS_SKIP_SMUDGE: "1" # ne pas checkout les objets LFS


# =============================================================================
# STAGE : init
# =============================================================================
python-init:
  stage: init
  image: ${PUBLIC_REMOTE_REGISTRY_DOCKER}/${IMAGE_PYTHON}
  before_script:
    - !reference [default, before_script]
    - curl -f -L -u ${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN} "https://${UL_ARTIFACTORY_HOST}/artifactory/jfrog-cli-go-remote/v2/2.96.0/jfrog-cli-linux-amd64/jfrog" -o jfrog
    - chmod 755 jfrog
    - export UUID=$(cat /proc/sys/kernel/random/uuid)
    - echo "JF_UUID=${UUID}" >> build.env
    - echo ${UUID} > uuid.txt
  script:
    - pip install virtualenv
    - virtualenv python_env
    - source python_env/bin/activate
    - ./jfrog config add ${UUID} --url=https://${UL_ARTIFACTORY_HOST}/ --access-token=${ARTIFACTORY_TOKEN} --interactive=false
    - ./jfrog pip-config --server-id-resolve=${UUID} --repo-resolve=pypi
    - ./jfrog pip install -r requirements.txt --no-cache-dir --force-reinstall --module grs
    - deactivate
  timeout: 15 minutes
  artifacts:
    paths:
      - jfrog
      - uuid.txt
      - python_env/
    reports:
      dotenv: build.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

