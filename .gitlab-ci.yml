# =============================================================================
# STAGE : test
# =============================================================================
python-tests:
  stage: test
  image: obs2co/python-with-git-lfs:1.0
  allow_failure: true
  tags:
    - tpa
  needs:
    - python-init
  variables:
    GIT_STRATEGY: clone
  before_script:
    - export CONDA_SSL_VERIFY=/etc/pki/tls/certs/ca-bundle.crt
    - export REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
    - export JOB_UUID=$(cat /proc/sys/kernel/random/uuid)
    - !reference [.jfrog_helpers, restore_config]
    - mkdir -p "${JFROG_CLI_HOME_DIR}/security/certs/"
    - cp ${REQUESTS_CA_BUNDLE} "${JFROG_CLI_HOME_DIR}/security/certs/"
    - ./jfrog config add ${JOB_UUID} --artifactory-url=https://${UL_ARTIFACTORY_HOST}/artifactory --access-token=${ARTIFACTORY_TOKEN} --user=${ARTIFACTORY_USER} --enc-password --interactive=false
    - ./jfrog pip-config --server-id-resolve=${JOB_UUID} --repo-resolve=pypi
    - export MY_JOB_WORKDIR="/work/scratch/data/${USER}/${JOB_UUID}"
    - export REF_DIR=/work/scratch/data/${USER}/OBS2CO/CI/REFS/
    - mkdir -p ${MY_JOB_WORKDIR}/LOGS ${MY_JOB_WORKDIR}/grs2
    - rsync -av --exclude='.git' --exclude='.jfrog' --exclude='python_env' ./ ${MY_JOB_WORKDIR}/grs2/
    - ssh trex.sis.cnes.fr "mkdir -p ${MY_JOB_WORKDIR}/grs2 ${MY_JOB_WORKDIR}/LOGS"
    - rsync -av --exclude='.git' --exclude='.jfrog' --exclude='python_env' ./ trex.sis.cnes.fr:${MY_JOB_WORKDIR}/grs2/
  script:
    - |
      ssh trex.sis.cnes.fr "MY_JOB_WORKDIR='${MY_JOB_WORKDIR}' USER='${USER}' REF_DIR='${REF_DIR}' ARTIFACTORY_TOKEN='${ARTIFACTORY_TOKEN}' ARTIFACTORY_USER='${ARTIFACTORY_USER}' bash -s" << 'EOF'
        set -e
        REMOTE_INIT="${MY_JOB_WORKDIR}/grs2/grs/tests/ci/ci-init_env.slurm"
        REMOTE_TEST="${MY_JOB_WORKDIR}/grs2/grs/tests/ci/ci-func-run.slurm"
        REMOTE_CLEAN="${MY_JOB_WORKDIR}/grs2/grs/tests/ci/ci-cleanup_env.slurm"
        sub_str=$(sbatch --export=MY_JOB_WORKDIR=${MY_JOB_WORKDIR},ARTIFACTORY_TOKEN=${ARTIFACTORY_TOKEN},ARTIFACTORY_USER=${ARTIFACTORY_USER} -o ${MY_JOB_WORKDIR}/LOGS/grs-init_env.out "${REMOTE_INIT}")
        id_init=${sub_str##* }
        echo "Job init -> ${id_init}"
        sub_str=$(sbatch --depend=afterany:${id_init} --export=MY_JOB_WORKDIR=${MY_JOB_WORKDIR},REF_DIR=${REF_DIR} -o ${MY_JOB_WORKDIR}/LOGS/grs-func-tests.out "${REMOTE_TEST}")
        id_job=${sub_str##* }
        echo "Job tests -> ${id_job}"
        sbatch --wait --depend=afterany:${id_job} --export=MY_JOB_WORKDIR=${MY_JOB_WORKDIR} -o ${MY_JOB_WORKDIR}/LOGS/grs-cleanup.out "${REMOTE_CLEAN}"
        # sbatch --wait returns the cleanup job's exit code, masking test failures.
        # Check the actual test job state via sacct.
        set +e
        test_state=$(sacct -j ${id_job} --format=State --noheader --parsable2 | head -1)
        init_state=$(sacct -j ${id_init} --format=State --noheader --parsable2 | head -1)
        set -e
        echo "Init job ${id_init} final state: ${init_state}"
        echo "Test job ${id_job} final state: ${test_state}"
        echo "TEST_STATE=${test_state}" > ${MY_JOB_WORKDIR}/test_result.txt
        exit 0
      EOF
    - mkdir -p reports
    - scp -r trex.sis.cnes.fr:${MY_JOB_WORKDIR}/reports/* reports/ || echo "Pas de dossier reports"
    - scp trex.sis.cnes.fr:${MY_JOB_WORKDIR}/LOGS/* reports/ || echo "Pas de logs"
    - scp trex.sis.cnes.fr:${MY_JOB_WORKDIR}/test_result.txt . 2>/dev/null || true
    - cat reports/grs-init_env.out 2>/dev/null || true
    - cat reports/grs-func-tests.out 2>/dev/null || true
    - cat reports/functionnal_tests-report.xml 2>/dev/null || true
    - cat reports/ref_diff* 2>/dev/null || true
    - |
      if [ -f test_result.txt ] && ! grep -q COMPLETED test_result.txt; then
        echo "=== Functional tests FAILED — check logs above ==="
        exit 1
      fi
      echo "=== Functional tests PASSED ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG || $CI_COMMIT_BRANCH'
  timeout: 60 minutes
  artifacts:
    untracked: true
    expire_in: 1 day
    reports:
      junit: reports/functionnal_tests-report.xml
  cache:
    key: "coverage-reports"
    paths:
      - reports/cov_report.xml
    policy: push

podman-test:
  stage: package
  image:
    name: ${PUBLIC_REMOTE_REGISTRY_DOCKER}/${IMAGE_PODMAN}
    entrypoint: [""]
  needs: []
  before_script:
    - mkdir -p certs
    - cp ${CNES_CERTIFICATE} certs/ca-bundle.crt
    - cat ${CNES_CERTIFICATE} >> certs/ca-certificates.crt
    - echo "$HTTP_PROXY" > /tmp/proxy_http
    - echo "$HTTPS_PROXY" > /tmp/proxy_https
    - export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
    - if [ -n "${CI_COMMIT_TAG}" ]; then export VERSION_GRS=${CI_COMMIT_TAG}; fi
    - echo "Version GRS -> ${VERSION_GRS}"
  script:
    - echo "https://${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}@artifactory.cnes.fr/artifactory/api/pypi/pypi/simple" > /tmp/artifactory_url
    - >
      podman build
      --network=host
      --build-arg IMAGE_SOURCE=${PUBLIC_REMOTE_REGISTRY_DOCKER}/
      --build-arg no_proxy=cnes.fr
      --file Dockerfile
      --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}"
      --tag "${DOCKER_IMAGE_NAME}:latest"
      --secret id=http_proxy,src=/tmp/proxy_http
      --secret id=https_proxy,src=/tmp/proxy_https
      --secret id=artifactory_url,src=/tmp/artifactory_url
      --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}"
      .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
      when: manual
      allow_failure: true
  artifacts:
    untracked: true
    expire_in: 1 day

# =============================================================================
# STAGE : package — Build & Push
# =============================================================================
podman-build:
  stage: package
  image:
    name: ${PUBLIC_REMOTE_REGISTRY_DOCKER}/${IMAGE_PODMAN}
    entrypoint: [""]
  needs:
    - python-tests
  before_script:
    - mkdir -p certs
    - cp ${CNES_CERTIFICATE} certs/ca-bundle.crt
    - cat ${CNES_CERTIFICATE} >> certs/ca-certificates.crt
    - echo "$HTTP_PROXY" > /tmp/proxy_http
    - echo "$HTTPS_PROXY" > /tmp/proxy_https
    - export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
    - if [ -n "${CI_COMMIT_TAG}" ]; then export VERSION_GRS=${CI_COMMIT_TAG}; fi
    - echo "Version GRS -> ${VERSION_GRS}"
  script:
    - echo "https://${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}@artifactory.cnes.fr/artifactory/api/pypi/pypi/simple" > /tmp/artifactory_url
    - >
      podman build
      --network=host
      --build-arg IMAGE_SOURCE=${PUBLIC_REMOTE_REGISTRY_DOCKER}/
      --build-arg no_proxy=cnes.fr
      --file Dockerfile
      --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}"
      --tag "${DOCKER_IMAGE_NAME}:latest"
      --secret id=http_proxy,src=/tmp/proxy_http
      --secret id=https_proxy,src=/tmp/proxy_https
      --secret id=artifactory_url,src=/tmp/artifactory_url
      --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}"
      .
    # Push a unique tag (Artifactory blocks overwriting existing tags).
    # docker-test pulls this tag via the build.env dotenv artifact.
    - export IMAGE_TAG="${CI_COMMIT_TAG}"
    - podman tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" "${DOCKER_IMAGE_NAME}:${IMAGE_TAG}"
    - echo "DOCKER_TEST_TAG=${IMAGE_TAG}" > build.env
    - podman push --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" "${DOCKER_IMAGE_NAME}:${IMAGE_TAG}"
    - >
      podman push --digestfile image-file-details --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" || echo "WARN: push of :${VERSION_GRS} failed (continuing)"
    - >
      podman push --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" "${DOCKER_IMAGE_NAME}:latest" || echo "WARN: push of :latest failed (continuing)"
  rules:
    - if: '$CI_COMMIT_TAG'
  artifacts:
    untracked: true
    expire_in: 1 day
    reports:
      dotenv: build.env

# =============================================================================
# STAGE : package — Validation
# =============================================================================
docker-test:
  stage: package
  allow_failure: true
  variables:
    SINGULARITY_CACHEDIR: "/local/${USER}/.singularity"
    SINGULARITY_TMPDIR:   "/local/${USER}/tmp"
  needs:
    - podman-build
  tags:
    - tpa
  before_script:
    - module load singularity/3.10.2
    - export SINGULARITY_CACHEDIR="${CI_PROJECT_DIR}/.singularity/cache"
    - export SINGULARITY_TMPDIR="${CI_PROJECT_DIR}/.singularity/tmp"
    - export JOB_UUID=$(cat /proc/sys/kernel/random/uuid)
    - export REF_DIR="/work/scratch/data/${USER}/OBS2CO/CI/REFS/"
    - mkdir -p "${SINGULARITY_CACHEDIR}" "${SINGULARITY_TMPDIR}"
    - singularity remote login --username "${ARTIFACTORY_USER}" --password "${ARTIFACTORY_TOKEN}" docker://artifactory.cnes.fr
    - singularity pull grs.sif docker://${DOCKER_IMAGE_NAME}:${DOCKER_TEST_TAG}
    - export MY_JOB_WORKDIR="/work/scratch/data/${USER}/${JOB_UUID}"
    - mkdir -p ${MY_JOB_WORKDIR}/LOGS ${MY_JOB_WORKDIR}/grs2
    - rsync -av --exclude='.git' --exclude='.jfrog' --exclude='python_env' ./ ${MY_JOB_WORKDIR}/grs2/
    - ssh trex.sis.cnes.fr "mkdir -p ${MY_JOB_WORKDIR}/grs2 ${MY_JOB_WORKDIR}/LOGS"
    - rsync -av --exclude='.git' --exclude='.jfrog' --exclude='python_env' ./ trex.sis.cnes.fr:${MY_JOB_WORKDIR}/grs2/
  script:
    - |
      ssh trex.sis.cnes.fr "MY_JOB_WORKDIR='${MY_JOB_WORKDIR}' REF_DIR='${REF_DIR}' bash -s" << 'EOF'
        sbatch --wait \
          --export=MY_JOB_WORKDIR=${MY_JOB_WORKDIR},REF_DIR=${REF_DIR} \
          -o ${MY_JOB_WORKDIR}/LOGS/grs-docker_test.out \
          ${MY_JOB_WORKDIR}/grs2/grs/tests/ci/ci-docker-run.slurm
      EOF
      SSH_EXIT=$?
    - mkdir -p reports
    - scp -r trex.sis.cnes.fr:${MY_JOB_WORKDIR}/reports/* reports/ || echo "Pas de dossier reports"
    - scp trex.sis.cnes.fr:${MY_JOB_WORKDIR}/LOGS/* reports/ || echo "Pas de logs"
    - cat reports/docker-report.xml 2>/dev/null || echo "(no docker-report.xml)"
    - cat reports/ref_diff_docker_*.log 2>/dev/null || true
    - exit ${SSH_EXIT}
  rules:
    - if: '$CI_COMMIT_TAG'
      allow_failure: true
  artifacts:
    paths:
      - reports/
    expire_in: 1 day
