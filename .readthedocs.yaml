version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats: all

# The notebooks are rendered with their stored outputs, not executed: the docs only need
# grs (imported by autodoc) and the Sphinx stack of the docs extra.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
