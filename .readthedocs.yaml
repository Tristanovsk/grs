version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "miniforge3-latest"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats: all

conda:
  environment: docs/environment.yml

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - docs