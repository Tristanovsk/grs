# Default configuration of GRS.
#
# Do not edit this file: write the settings to change in your user configuration file,
# ~/.config/grs/config.yml (create it with `grs_config --init [/path/to/lut]`). Only the keys that
# differ from these defaults are needed. Print the configuration in use with `grs_config`.

path:
  # folder of the look-up tables (LUTs); also set by the environment variable GRS_DATA_ROOT;
  # null: default folder of the user data, ~/.local/share/grs/lut on Linux (see `grs_config`)
  grsdata: null
  # LUT file names, in grsdata (download them with `grs_config --download`)
  toa_lut: 'toa_lut_opac_wind_v3.nc'
  trans_lut: 'transmittance_lut_opac_wind_v3.nc'
  # root folder of the CAMS archive, used when no CAMS file is given to Process.execute: daily files
  # <cams>/YYYY/MM/DD/YYYY-MM-DD-cams-global-atmospheric-composition-forecasts[_<tile>].nc, the global
  # file of the day if it exists, else the file of the tile (downloaded from the ADS if needed)
  cams: '/work/datalake/watcal/cams'

# Zenodo record of the LUTs (dataset shared by GRS and hGRS, https://doi.org/10.5281/zenodo.23394202),
# used by `grs_config --download`
zenodo:
  url: 'https://zenodo.org'
  record: 23394202
  # download the missing LUTs automatically before the first processing (also switched off by the
  # environment variable GRS_NO_DOWNLOAD=1, e.g. without internet access)
  auto_download: true

settings:
  # OPAC aerosol models of the LUTs, and default weights of their combination
  aerosol_combination: [0, 0.5, 0, 0.5, 0., 0.]
  aerosol_models: ['ARCT_rh70', 'COAV_rh70', 'DESE_rh70', 'MACL_rh70', 'URBA_rh70', 'WASO_rh0']

# retrieval of the aerosol optical thickness (AOT), see the methods page of the documentation; the
# parameters of the same name of Process.execute override them, aot_resolution also --aot_resolution
aerosol:
  # pixel size (m) of the coarse raster of the water pixels on which the AOT is retrieved; a multiple of
  # the pixel size of the image (10, 20, 30 or 60 m)
  aot_resolution: 240
  # coarse pixels of the coarse raster kept: more water pixels than this proportion of the fullest one
  min_pixel_prop: 0.5
  # size (coarse pixels) of the retrieval blocks: one AOT value per block of aot_chunk * aot_resolution
  # meters (64 x 240 m = 15 km: about 7 x 7 blocks for a Sentinel-2 tile). Validated against AERONET-OC
  # (notebook/settings_aerosols/AERONET-OC): the AOT and Rrs are the most accurate with blocks of 15 km;
  # larger blocks (256: 61 km) underestimate the AOT in heterogeneous coastal scenes
  aot_chunk: 64
  # blocks with an AOT above outlier_factor times the median get the median AOT and a null weight
  outlier_factor: 1.5
  # window (blocks) of the weighted mean of the block AOT values (weights: water pixels of the blocks)
  aot_smoothing_blocks: 3
  # smoothing of the transitions between blocks, on a grid of fine_step coarse pixels: NaN-mean over
  # fine_window cells of this grid (null: about one block, aot_chunk / fine_step, odd)
  fine_step: 5
  fine_window: null
  # AOT step of the look-up tables prepared for the final processing
  aot_step: 0.01

processor:
  ncpu: 8                       # number of processes of the parallel parts
  chunk: 512                    # size (pixels) of the processing blocks
  netcdf_engine: 'h5netcdf'     # engine used to read the NetCDF inputs
