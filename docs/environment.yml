# Conda environment of the Read the Docs build.
# requirements.txt and the docs extra are installed with pip (see .readthedocs.yaml).
# The GDAL Python bindings (osgeo) are not needed: rasterio/fiona wheels bundle libgdal.
name: grs-docs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cartopy
  - pip
