name: Sync to GitLab

on:
  push:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Utilisation du Dockerfile de Gitlab
        run: |
          mv Dockerfile-gitlab Dockerfile

      - name: Configure GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.cnes.fr/waterquality/grs2.git"

      - name: Push de la branche
        if: github.ref_type == 'branch'
        run: |
          echo "Synchronisation de la branche ${GITHUB_REF_NAME}"
          git push --force-with-lease  gitlab "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Push du tag
        if: github.ref_type == 'tag'
        run: |
          echo "Synchronisation du tag ${GITHUB_REF_NAME}"
          git push gitlab "HEAD:refs/tags/${GITHUB_REF_NAME}"
