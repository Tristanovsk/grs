# Build GRS and publish it on PyPI as GRSprocessor (see "Releasing on PyPI" in CONTRIBUTING.md).
#
# - push of a tag v*: build, then publish on PyPI;
# - by hand (Actions tab, "Run workflow"): build, then publish on TestPyPI or PyPI.
#
# Trusted publishing (no token stored): declare this repository, this workflow (pypi.yml) and the
# environment (pypi / testpypi) as a trusted publisher of the GRSprocessor project on pypi.org and
# test.pypi.org before the first run.
name: Publish on PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Package index'
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check the version and the content of the wheel
        run: |
          version=$(python -c "import ast, pathlib; t = pathlib.Path('grs/__init__.py').read_text(); print(next(n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'))")
          echo "version: $version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "the tag $GITHUB_REF_NAME does not match grs.__version__ ($version)"; exit 1
          fi
          unzip -l dist/*.whl
          if unzip -l dist/*.whl | grep -E "grs/tests/|grs/data/lut/[^/]+\.nc"; then
            echo "tests or large LUTs in the wheel"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/GRSprocessor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.repository == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/GRSprocessor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
