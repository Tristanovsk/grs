name: Pipeline documentation

on:
  push:
    branches:
      - 'feature/*'
      - main
      - develop
    tags:
      - '*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

# =============================================================================
# Change detection — a tag push always triggers the rest of the pipeline,
# a branch push only if docs/ was modified.
# =============================================================================

  changes:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect changes under docs/
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'

# =============================================================================
# Documentation
# =============================================================================

  doc:
    needs: changes
    if: |
      always() &&
      (github.ref_type == 'tag' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
          python -m pip install sphinx furo
          python -m pip install myst-parser
          python -m pip install sphinx-autoapi
          python -m pip install sphinxcontrib-mermaid

      - name: Build Sphinx documentation to HTML
        run: |
          cd docs
          make html

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: documentation
          path: |
            docs/build/html/
          retention-days: 1

      - name: Upload Pages artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: github.ref_type == 'tag'
    needs: doc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4