name: Pipeline CI

on:
  push:
    branches:
      - feature/dev-ci
  pull_request:
    branches:
      - feature/dev-ci

env:
  TARGET_REPO: "obs2co-docker"
  SUFFIX_DOCKER_IMAGE: "grs"

jobs:
  init:
   runs-on: ubuntu-latest
   container:
      image: python:3.11.14-bookworm
   steps:
     - uses: actions/checkout@v4
     - run: |
         python -m venv python_env
         . python_env/bin/activate
         python -m pip install --upgrade pip
         python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
     - name: Upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: python-env
         path: python_env/ 
         retention-days: 1

  build:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          export DOCKER_IMAGE_NAME="${TARGET_REPO}/${SUFFIX_DOCKER_IMAGE}"
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
          if [ -n "${CI_COMMIT_TAG}" ]; then export VERSION_GRS=${CI_COMMIT_TAG}; fi
          echo "Version GRS -> ${VERSION_GRS}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"

          export IMAGE_TAG="${CI_COMMIT_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} ${DOCKER_IMAGE_NAME}:${IMAGE_TAG}
          podman tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" "${DOCKER_IMAGE_NAME}:${IMAGE_TAG}"


  
   
  
