name: Pipeline CI

on:
  push:
    branches:
      - feature/dev-ci
    tags:
      - '*'
  pull_request:
    branches:
      - feature/dev-ci

env:
  TARGET_REPO: "obs2co-docker"
  SUFFIX_DOCKER_IMAGE: "grs"

jobs:
# =============================================================================
# init
# =============================================================================
  python-init:
   runs-on: ubuntu-latest
   container:
      image: python:3.11.14-bookworm
   steps:
     - uses: actions/checkout@v4
     - name : Init
       run: |
         python -m venv python_env
         . python_env/bin/activate
         python -m pip install --upgrade pip
         python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
         tar czf python_env.tar.gz python_env
     - name: Upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: python-env
         path: python_env.tar.gz
         retention-days: 1

# =============================================================================
# quality
# =============================================================================
  pytest:
    needs: python-init   
    runs-on: ubuntu-latest
    container:
       image: python:3.11.14-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-env
      - name: pytest
        run: |
          tar xzf python_env.tar.gz
          python_env/bin/python -m pip install pytest pytest-cov
          echo "Execution de pytest"
          python_env/bin/python --version
          python_env/bin/python -m pip show pytest
          python_env/bin/python -m pytest --version
          mkdir -p .coverage-reports reports
          python_env/bin/python -m pytest --cov=grs --cov-report=xml:.coverage-reports/coverage.xml --cov-report=term --junitxml=reports/unit_tests-report.xml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 1

# =============================================================================
# test
# =============================================================================
  python-tests:
   needs: python-init
   runs-on: ubuntu-latest
   container:
     image: openeuler/slurm:25.11.6.1-oe2403sp3
   steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          echo "TODO"

# =============================================================================
# package — Build & Push
# =============================================================================
  podman-build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          export DOCKER_IMAGE_NAME="${TARGET_REPO}/${SUFFIX_DOCKER_IMAGE}"
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_GRS=${GITHUB_REF_NAME};
          fi
          echo "Version GRS -> ${VERSION_GRS}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
                -u "${{ secrets.DOCKERHUB_LOGIN }}" \
                --password-stdin
                
            echo "Tag de l'image pour docker.io"
            echo "podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${VERSION_GRS}"
             
            podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${VERSION_GRS}
            podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
            
            echo "Publication vers docker.io"
            podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          fi
  
