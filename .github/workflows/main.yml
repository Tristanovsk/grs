name: Pipeline CI

on:
  push:
    branches:
      - feature/dev-ci
  pull_request:
    branches:
      - feature/dev-ci

jobs:
  init:
   runs-on: ubuntu-latest
   container:
      image: python:3.11.14-bookworm
   steps:
     - name: Vérifier la version de Python
       run: python --version
     - run: |
        pip install virtualenv
        echo "Exec virtualenv python_env"
        virtualenv python_env
        echo "activate"
        source python_env/bin/activate
        echo "pip install"
        pip install -r requirements.txt --no-cache-dir --force-reinstall --module grs
        echo "deactivate"
        deactivate
     - name: Upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: rep-python
         path: python_env/ 
         retention-days: 1

      
   
  
