name: Pipeline CI

on:
  push:
    branches:
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
      - 'bugfix/*'
      - main
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - develop


env:
  DOCKER_IMAGE_NAME : "grs"

jobs:
# =============================================================================
# test
# =============================================================================
  python-tests:
   runs-on: ubuntu-latest
   steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation dépendances et lancement des tests
        run: |
          echo "Création de l'environnement python"
          python -m venv python_env
          . python_env/bin/activate
          python -m pip install --upgrade pip

          echo "Installation des dépendances via pip"
          python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
          python -m pip install pytest pytest-cov
                           
          echo "Lancement des tests du répertoire grs/tests/unit/"
          python -m pytest --tb=short -vv -s -x grs/tests/unit/ --cov=grs --cov-report=html:cov_html --cov-report=xml:coverage.xml --junitxml=test-results.xml
          
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "Génération du badge coverage"
            python -m pip install genbadge[coverage]

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Le checkout d'un tag laisse le dépôt en detached HEAD : on ne peut
            # pas y "git push" directement. On bascule donc sur main (branche
            # depuis laquelle les tags sont coupés) avant de committer le badge.
            git fetch origin main
            git checkout -B main origin/main

            mkdir -p badges
            genbadge coverage -i coverage.xml -o badges/coverage.svg

            git add badges/coverage.svg

            if ! git diff --cached --quiet; then
              git commit -m "Update coverage badge [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Résumé des tests et de la couverture
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          summary = []

          try:
              root = ET.parse('test-results.xml').getroot()
              suite = root.find('testsuite') if root.tag == 'testsuites' else root
              tests = int(suite.get('tests', 0))
              failures = int(suite.get('failures', 0))
              errors = int(suite.get('errors', 0))
              skipped = int(suite.get('skipped', 0))
              passed = tests - failures - errors - skipped
              time = float(suite.get('time', 0))
              summary += [
                  '## Tests unitaires',
                  '',
                  '| Total | Réussis | Échoués | Erreurs | Ignorés | Durée |',
                  '|---|---|---|---|---|---|',
                  f'| {tests} | {passed} | {failures} | {errors} | {skipped} | {time:.1f}s |',
              ]
          except (FileNotFoundError, ET.ParseError):
              summary += ['## Tests unitaires', '', '_pas de résultats (test-results.xml manquant)_']

          try:
              root = ET.parse('coverage.xml').getroot()
              line_rate = float(root.get('line-rate', 0)) * 100
              summary += [
                  '',
                  '## Couverture',
                  '',
                  f"**{line_rate:.1f}%** des lignes couvertes "
                  f"({root.get('lines-covered')}/{root.get('lines-valid')})",
              ]
          except (FileNotFoundError, ET.ParseError):
              summary += ['', '## Couverture', '', '_pas de rapport (coverage.xml manquant)_']

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(summary) + '\n')
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # Upload même si les tests échouent
        with:
          name: test-reports
          path : |
            coverage.xml
            test-results.xml
            cov_html/
          retention-days: 1

# =============================================================================
# package — Publication sur Pypi
# =============================================================================
  pypi:
    needs: python-tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name : Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publication sur Pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

# =============================================================================
# package — Build & Publication sur Docker Hub
# =============================================================================
  podman-build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # omnicloudmask (torch) pushed the image build over the runner's default free space
        # ("no space left on device" while podman commits the layer): the GitHub-hosted ubuntu
        # runner ships several GB of preinstalled toolchains we don't use (.NET, Android, Haskell,
        # Swift) and ~20-30 GB of unused container images; remove them first to get headroom back.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Build image
        run: |
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(python3 -c "import ast, pathlib; t = pathlib.Path('grs/__init__.py').read_text(); print(next(n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'))")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_GRS=${GITHUB_REF_NAME};
          fi
          # TEMPORARY: force la version 2.1.9 sur feature/dev-ci pour republier
          # l'image cassée guillaumeeb/grs:2.1.9 (fix packaging grs.data.auxiliary)
          # sans toucher au tag git v2.1.9. A retirer une fois l'image republiée.
          if [ "$GITHUB_REF_NAME" = "feature/dev-ci" ]; then
            export VERSION_GRS=2.1.9;
          fi
          echo "Version GRS -> ${VERSION_GRS}"
          echo "VERSION_GRS=${VERSION_GRS}" >> "$GITHUB_ENV"

          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile-github \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"
          echo "Build terminé"

      - name: Publication des images sur Docker Hub
        # TEMPORARY: autorise aussi feature/dev-ci (voir commentaire ci-dessus). A retirer ensuite.
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/feature/dev-ci'
        run: |
          echo "On se loggue à docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin

          echo "Tag de l'image pour docker.io"
          echo "podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${VERSION_GRS}"

          podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${VERSION_GRS}
          podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest

          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:${VERSION_GRS}"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${VERSION_GRS}
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:latest"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          echo "Images publiées"


# =============================================================================
# quality
# =============================================================================

  lint:
    if: github.event_name == 'pull_request' || github.ref_type == 'tag'
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name : Install ruff and mypi
        run: pip install ruff mypy

      - name: Run ruff
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-report.json

      - run: pip install -r requirements.txt

      - name: Run mypy
        continue-on-error: true
        run: mypy . --junit-xml mypy-report.xml
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-report.json
            mypy-report.xml
          retention-days: 1



  # The "sync" job to GitLab has been moved to the dedicated workflow
  # .github/workflows/gitlab-sync.yml: direct push is rejected on GitLab's
  # protected main/develop branches (pre-receive hook), replaced by a
  # PR -> GitLab branch -> GitLab Merge Request flow.

