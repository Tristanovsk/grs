name: Pipeline CI

on:
  push:
    branches:
      - feature/dev-ci
    tags:
      - '*'
  pull_request:
    branches:
      - feature/dev-ci

env:
  DOCKER_IMAGE_NAME : "grs"

jobs:
# =============================================================================
# test
# =============================================================================
  python-tests:
   if: false
   runs-on: ubuntu-latest
   steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
          
      - name: Tests
        run: |
         python -m venv python_env
         . python_env/bin/activate
         python -m pip install --upgrade pip
         GDAL_VERSION=$(gdal-config --version)
         echo "GDAL system version: $GDAL_VERSION"

         echo "Installation des dépendances"
         python -m pip install GDAL==$GDAL_VERSION
         python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
         python -m pip install pytest
         python -m pip install -U datashader # la version du requirements.txt n'est plus compatible avec dask

         echo "Lancement des tests du répertoire  grs/tests/integration_tests/"
         python -m pytest grs/tests/integration_tests/ --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # Upload même si les tests échouent
        with:
          name: pytest-results
          path: test-results.xml
          retention-days: 1

# =============================================================================
# package — Build & Push
# =============================================================================
  podman-build:
    if: false
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_GRS=${GITHUB_REF_NAME};
          fi
          echo "Version GRS -> ${VERSION_GRS}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"
          echo "Build terminé"

      - name: Publication des images sur docker Hub
        if: github.ref_type == 'tag'
        run: |
          echo "On se loggue à docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin
         
          echo "Tag de l'image pour docker.io"
          echo "podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
           
          podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:latest"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          echo "Images publiées"


# =============================================================================
# quality
# =============================================================================
  sonar:
    #needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: debug
        run: |
          echo "SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }}"
          echo "SONAR_ORGANIZATION=${{ vars.SONAR_ORGANIZATION }}"
          echo "SONAR_PROJECT_KEY=${{ vars.SONAR_PROJECT_KEY }}"
          echo "SONAR_PROJECT_NAME=${{ vars.SONAR_PROJECT_NAME }}"
          echo "SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}"
   
          #curl -v -u "${{ secrets.SONAR_TOKEN }}:" -H "Accept: application/x-protobuf"   "${{ secrets.SONAR_HOST_URL }}/api/ce/submit"
          curl -v -u "${{ secrets.SONAR_TOKEN }}:" -X POST  "${{ secrets.SONAR_HOST_URL }}/api/ce/submit"

      - name : Scan docker
        run:
          |
          export SONAR_TOKEN= ${{ secrets.SONAR_TOKEN }}
          export SONAR_HOST_URL==${{ secrets.SONAR_HOST_URL }}

          docker run --rm \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -v "$PWD:/usr/src" \
            artifactory.cnes.fr/publicremotes-docker/sonarsource/sonar-scanner-cli:11.3.1.1910_7.1.0 \
            -X \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME }} \
            -Dsonar.branch.name=${{ github.ref_name }}


      - name: Scan Sonar
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -X
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME }}
            -Dsonar.branch.name=${{ github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

            

    

      

      


