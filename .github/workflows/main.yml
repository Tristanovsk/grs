name: Pipeline CI

on:
  push:
    branches:
      - 'feature/*'
      - main
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - develop


env:
  DOCKER_IMAGE_NAME : "grs"

jobs:
# =============================================================================
# test
# =============================================================================
  python-tests:
   runs-on: ubuntu-latest
   steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation du paquet gdal
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Installation dépendances et lancement des tests
        run: |
          echo "Création de l'environnement python"
          python -m venv python_env
          . python_env/bin/activate
          python -m pip install --upgrade pip
          GDAL_VERSION=$(gdal-config --version)
          echo "GDAL system version: $GDAL_VERSION"

          echo "Installation des dépendances via pip"
          python -m pip install GDAL==$GDAL_VERSION
          python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
          python -m pip install pytest pytest-cov
          python -m pip install -U datashader # la version du requirements.txt n'est plus compatible avec dask
                           
          echo "Lancement des tests du répertoire  grs/tests/integration_tests/"
          python -m pytest --tb=short -vv -s -x grs/tests/integration_tests/ --cov=grs --cov-report=html:cov_html --cov-report=xml:coverage.xml --junitxml=test-results.xml
          
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "Génération du badge coverage"
            python -m pip install genbadge[coverage]
            mkdir -p badges
         
            genbadge coverage -i coverage.xml -o badges/coverage.svg

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add badges/coverage.svg

            if ! git diff --cached --quiet; then
              git commit -m "Update coverage badge [skip ci]"
              git push
            fi
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: false
        #if: always()   # Upload même si les tests échouent
        with:
          name: test-reports
          path : | 
            coverage.xml
            test-results.xml
            cov_html/
          retention-days: 1

# =============================================================================
# package — Publication sur Pypi
# =============================================================================
  pypi:
    needs: python-tests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name : Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publication sur Pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

# =============================================================================
# package — Build & Publication sur Docker Hub
# =============================================================================
  podman-build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_GRS=${GITHUB_REF_NAME};
          fi
          echo "Version GRS -> ${VERSION_GRS}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile-github \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"
          echo "Build terminé"

      - name: Publication des images sur Docker Hub
        if: github.ref_type == 'tag'
        run: |
          echo "On se loggue à docker.io"
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io \
              -u "${{ secrets.DOCKERHUB_LOGIN }}" \
              --password-stdin
         
          echo "Tag de l'image pour docker.io"
          echo "podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
           
          podman tag ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME} docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          podman tag ${DOCKER_IMAGE_NAME}:latest docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}
          echo "Publication vers docker.io de ${DOCKER_IMAGE_NAME}:latest"
          podman push docker.io/${{ secrets.DOCKERHUB_LOGIN }}/${DOCKER_IMAGE_NAME}:latest
          echo "Images publiées"


# =============================================================================
# quality
# =============================================================================

  lint:
    if: github.event_name == 'pull_request' || github.ref_type == 'tag'
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name : Install ruff and mypi
        run: pip install ruff mypy

      - name: Run ruff
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-report.json

      - run: pip install -r requirements.txt

      - name: Run mypy
        continue-on-error: true
        run: mypy . --junit-xml mypy-report.xml
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            ruff-report.json
            mypy-report.xml
          retention-days: 1



  sync:
    needs: podman-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo

      - name: Find LFS files in history
        shell: bash
        run: |
          set -euo pipefail

          echo "Reference : ${GITHUB_REF}"
          echo "Commit    : ${GITHUB_SHA}"

          : > /tmp/lfs-files.txt

          echo
          echo "=== Searching LFS pointers in history ==="

          while read -r commit; do
            git ls-tree -r "$commit"
          done < <(git rev-list HEAD) |
          while read -r mode type object path; do
            [ "$type" = "blob" ] || continue

            if git cat-file blob "$object" 2>/dev/null |
              head -n 1 |
              grep -Fxq 'version https://git-lfs.github.com/spec/v1'; then
              printf '%s\n' "$path"
            fi
          done |
          sort -u > /tmp/lfs-files.txt

          echo
          echo "=== LFS files ==="

          if [ -s /tmp/lfs-files.txt ]; then
            cat /tmp/lfs-files.txt
            echo
            echo "Count: $(wc -l < /tmp/lfs-files.txt)"
          else
            echo "No LFS files found."
          fi
     

      - name: Remove LFS files and .gitattributes
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/remove-paths.txt <<'EOF'
          grs/tests/.gitattributes
          EOF

          if [ -s /tmp/lfs-files.txt ]; then
            cat /tmp/lfs-files.txt >> /tmp/remove-paths.txt
          fi

          echo "=== Paths to remove ==="
          cat /tmp/remove-paths.txt

          git filter-repo \
            --invert-paths \
            --paths-from-file /tmp/remove-paths.txt \
            --force
          
      - name: Verify no LFS remains
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Checking .gitattributes ==="

          if git ls-tree -r HEAD --name-only | grep -Fxq 'grs/tests/.gitattributes'; then
            echo "ERROR: grs/tests/.gitattributes still exists"
            exit 1
          fi

          echo "OK: .gitattributes removed"

          echo
          echo "=== Checking LFS pointers ==="

          FOUND=0

          while read -r commit; do
            while read -r mode type object path; do
              [ "$type" = "blob" ] || continue

              if git cat-file blob "$object" 2>/dev/null |
                 head -n 1 |
                 grep -Fxq 'version https://git-lfs.github.com/spec/v1'; then

                echo "ERROR: LFS pointer found"
                echo "  commit: $commit"
                echo "  path:   $path"

                FOUND=1
              fi
            done < <(git ls-tree -r "$commit")
          done < <(git rev-list HEAD)

          if [ "$FOUND" -ne 0 ]; then
            echo
            echo "ERROR: LFS pointers are still present."
            echo "Nothing will be pushed to GitLab."
            exit 1
          fi

          echo "OK: no LFS pointers found."

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          GIT_LFS_SKIP_PUSH: "1"
        shell: bash
        run: |
          set -euo pipefail

          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.cnes.fr/waterquality/grs2.git"
          git push  gitlab  "HEAD:${GITHUB_REF}" --force

