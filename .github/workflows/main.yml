name: Pipeline CI

on:
  push:
    branches:
      - feature/dev-ci
    tags:
      - '*'
  pull_request:
    branches:
      - feature/dev-ci

env:
  TARGET_REPO: "obs2co-docker"
  SUFFIX_DOCKER_IMAGE: "grs"

jobs:
  init:
   runs-on: ubuntu-latest
   container:
      image: python:3.11.14-bookworm
   steps:
     - uses: actions/checkout@v4
     - name : Init
       run: |
         python -m venv python_env
         . python_env/bin/activate
         python -m pip install --upgrade pip
         python -m pip install -r requirements.txt --no-cache-dir --force-reinstall
     - name: Upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: python-env
         path: python_env/ 
         retention-days: 1

  build:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          export DOCKER_IMAGE_NAME="${TARGET_REPO}/${SUFFIX_DOCKER_IMAGE}"
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}"
          export VERSION_GRS=$(grep version pyproject.toml | cut -d '"' -f 2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            export VERSION_GRS=${GITHUB_REF_NAME};
          fi
          echo "Version GRS -> ${VERSION_GRS}"
          
          podman build \
            --network=host \
            --build-arg IMAGE_SOURCE="" \
            --build-arg no_proxy=cnes.fr \
            --file Dockerfile \
            --tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" \
            --tag "${DOCKER_IMAGE_NAME}:latest"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag : $GITHUB_REF_NAME"
            echo "podman tag ${DOCKER_IMAGE_NAME}:${VERSION_GRS} ${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
            podman tag "${DOCKER_IMAGE_NAME}:${VERSION_GRS}" "${DOCKER_IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
         


  
   
  
